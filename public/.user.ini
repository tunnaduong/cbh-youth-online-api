open_basedir=/www/wwwroot/api.chuyenbienhoa.com/:/tmp/

; Chat attachments allow up to 100MB (see ChatController::sendMessage
; validation) - PHP's own defaults (typically 2-8MB post_max_size /
; upload_max_filesize) are far below that and would reject or truncate the
; request before Laravel's validation ever runs. Note: this only covers
; PHP-FPM's own limits - if requests still fail before reaching PHP at all
; (a blank 500 with an empty body, or a "network error" with no HTTP
; response at all), the web server/reverse proxy in front of PHP-FPM
; (nginx's client_max_body_size, commonly capped at 1-50M by aaPanel's
; default site config) also needs raising - see deploy/nginx-upload-size.conf.
upload_max_filesize=105M
post_max_size=110M
max_execution_time=600
max_input_time=600
memory_limit=256M

; PHP buffers every upload to a temp file before Laravel ever sees it. The
; default temp dir (sys_get_temp_dir(), usually /tmp) is a small RAM-backed
; tmpfs on this box and can fill up, causing "Failed to write file to disk"
; on large uploads well under the 100MB limit above. Point it at disk-backed
; storage inside the app instead (already covered by open_basedir below).
; Requires: mkdir -p storage/app/tmp-uploads && chmod 775 storage/app/tmp-uploads
upload_tmp_dir=/www/wwwroot/api.chuyenbienhoa.com/storage/app/tmp-uploads
sys_temp_dir=/www/wwwroot/api.chuyenbienhoa.com/storage/app/tmp-uploads