; Keeps `php artisan queue:work` running continuously so queued jobs
; (video/image compression, etc.) are actually processed in the background
; instead of falling back to inline/sync execution.
;
; Install: copy to /etc/supervisor/conf.d/cbh-queue-worker.conf on the
; server, update the paths below for your deployment, then run:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start cbh-queue-worker:*

[program:cbh-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/api.chuyenbienhoa.com/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.chuyenbienhoa.com/storage/logs/queue-worker.log
stopwaitsecs=3600
