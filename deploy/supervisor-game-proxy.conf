; Optional: run the game proxy under Supervisor instead of letting the
; scheduler start it (set GAME_PROXY_AUTOSTART=false when you use this).
[program:cbh-game-proxy]
process_name=%(program_name)s
command=php /www/wwwroot/api.chuyenbienhoa.com/artisan game-proxy:start
directory=/www/wwwroot/api.chuyenbienhoa.com
autostart=true
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=/www/wwwroot/api.chuyenbienhoa.com/storage/logs/game-proxy.log
stopwaitsecs=10
