# nginx sits in front of PHP-FPM and enforces its own request body size
# cap independent of PHP's post_max_size/upload_max_filesize (see
# public/.user.ini). Its default (1M, or whatever aaPanel's site template
# set - commonly 20-50M) is far below the 100MB chat attachment / study
# material limits used by the API, so an oversized upload never even
# reaches PHP: nginx rejects it directly, which shows up client-side as
# either a blank/empty 500 response or a generic "network error" with no
# HTTP response at all.
#
# In aaPanel: Website -> (this site) -> Config File, add the line below
# inside the `server { ... }` block (NOT nested in a `location` block, so
# it also covers request bodies nginx rejects before routing), then
# reload nginx (or Website -> Reload from the panel).
#
# If reverse-proxied through Cloudflare or another edge/CDN in front of
# nginx, check its own upload/body-size and request-duration limits too -
# raising nginx alone won't help if the edge cuts the request off first.

client_max_body_size 105m;
