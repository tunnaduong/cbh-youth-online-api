# Public face of the game proxy: a SEPARATE domain (not a subdomain of
# chuyenbienhoa.com - the login cookie is set for .chuyenbienhoa.com and every
# subdomain would receive it). Point the domain at this server, add TLS in
# aaPanel, then use this as the site's location block.
location / {
    proxy_pass http://127.0.0.1:8099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Games stream big files; do not buffer them on disk.
    proxy_buffering off;
    proxy_read_timeout 300s;
    # Let the browser and Cloudflare cache the game's static files.
    proxy_ignore_headers X-Accel-Expires;
}
